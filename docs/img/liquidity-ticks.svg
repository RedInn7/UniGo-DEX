<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Inter','SF Pro Display','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Segoe UI',system-ui,sans-serif">
<!-- 集中流动性与 tick -->
<defs>
<linearGradient id="g-client" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="g-gate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
<linearGradient id="g-core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
<linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
<linearGradient id="g-state" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#047857"/></linearGradient>
<linearGradient id="g-chain" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#c2410c"/></linearGradient>
<linearGradient id="g-risk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f43f5e"/><stop offset="1" stop-color="#9d174d"/></linearGradient>
<linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
<linearGradient id="g-grey" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#334155"/></linearGradient>
<linearGradient id="g-chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#172554"/></linearGradient>
<linearGradient id="g-title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".04"/></pattern>
<filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity=".3"/></filter>
<filter id="glow" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feFlood flood-color="#38bdf8" flood-opacity=".55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#38bdf8"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#fbbf24"/></marker>
<marker id="a-tx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f472b6"/></marker>
<style>
.layer{fill:#ffffff;fill-opacity:.03;stroke:#ffffff;stroke-opacity:.1;stroke-width:1}
.lt{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#8b949e}
.box{stroke:rgba(255,255,255,.15);stroke-width:1.2}
.tag{font:500 10px 'JetBrains Mono','SF Mono',Menlo,Consolas,'PingFang SC','Microsoft YaHei',monospace;fill:#fff;fill-opacity:.72}
.t{font-size:15px;font-weight:700;fill:#fff}
.s{font-size:11px;fill:#fff;fill-opacity:.82}
.c1{font-size:13px;font-weight:700;fill:#fff}
.c2{font-size:10px;fill:#fff;fill-opacity:.8}
.note{font-size:11px;fill:#8b949e}
.p{font-size:12px;fill:#c9d1d9}
.hl{font-size:12px;font-weight:700;fill:#7dd3fc}
.sync{fill:none;stroke:#38bdf8;stroke-width:1.8}
.async{fill:none;stroke:#fbbf24;stroke-width:1.8;stroke-dasharray:5 5;animation:flow 1.2s linear infinite}
.tx{fill:none;stroke:#f472b6;stroke-width:1.8}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.async{animation:none}}
</style>
</defs>

<rect width="1200" height="800" fill="#0d1117"/><rect width="1200" height="800" fill="url(#dots)"/>
<text x="40" y="40" font-size="24" font-weight="800" fill="url(#g-title)">集中流动性与 tick</text>
<text x="40" y="62" font-size="12.5" fill="#8b949e">每个头寸只在自己的价格区间里做市。swap 沿价格轴一段一段地走，走到已初始化的 tick 就调整活跃流动性。</text>
<!-- Panel A: 流动性分布 -->
<rect class="layer" x="40" y="76" width="1120" height="328" rx="12"/>
<text class="lt" x="64" y="93" text-anchor="start">LIQUIDITY 流动性按价格区间叠起来</text>
<text class="note" x="1136" y="93" text-anchor="end" >price = 1.0001^tick · tickSpacing：0.05% → 10，0.3% → 60，1% → 200</text>
<rect class="box" x="140" y="300" width="920" height="40" rx="8" ry="8" fill="url(#g-core)" fill-opacity=".9" filter="url(#shadow)"/>
<text class="c1" x="310" y="324.5" text-anchor="middle" >宽区间头寸（打底）</text>
<rect class="box" x="220" y="255" width="180" height="45" rx="8" ry="8" fill="url(#g-teal)" fill-opacity=".9" filter="url(#shadow)"/>
<text class="c1" x="310" y="282.0" text-anchor="middle" >单边头寸（现价下方）</text>
<rect class="box" x="460" y="220" width="240" height="80" rx="8" ry="8" fill="url(#g-violet)" fill-opacity=".9" filter="url(#shadow)"/>
<text class="c1" x="640" y="264.5" text-anchor="middle" >窄区间头寸</text>
<rect class="box" x="800" y="255" width="180" height="45" rx="8" ry="8" fill="url(#g-teal)" fill-opacity=".9" filter="url(#shadow)"/>
<text class="c1" x="890" y="282.0" text-anchor="middle" >单边头寸（现价上方）</text>
<path d="M100 340 H1104" stroke="#c9d1d9" stroke-width="1.5" fill="none"/><path d="M1104 335 L1114 340 L1104 345 Z" fill="#c9d1d9"/>
<text class="note" x="1122" y="344" text-anchor="start" >价格</text>
<circle cx="140" cy="340" r="4.5" fill="#fbbf24" stroke="#0d1117" stroke-width="1.5"/>
<circle cx="220" cy="340" r="4.5" fill="#fbbf24" stroke="#0d1117" stroke-width="1.5"/>
<circle cx="400" cy="340" r="4.5" fill="#fbbf24" stroke="#0d1117" stroke-width="1.5"/>
<circle cx="460" cy="340" r="4.5" fill="#fbbf24" stroke="#0d1117" stroke-width="1.5"/>
<circle cx="700" cy="340" r="4.5" fill="#fbbf24" stroke="#0d1117" stroke-width="1.5"/>
<circle cx="800" cy="340" r="4.5" fill="#fbbf24" stroke="#0d1117" stroke-width="1.5"/>
<circle cx="980" cy="340" r="4.5" fill="#fbbf24" stroke="#0d1117" stroke-width="1.5"/>
<circle cx="1060" cy="340" r="4.5" fill="#fbbf24" stroke="#0d1117" stroke-width="1.5"/>
<circle cx="144" cy="360" r="4.5" fill="#fbbf24"/>
<text class="p" x="156" y="364" text-anchor="start" >已初始化的 tick：4 个头寸一共 8 个边界，只有走到这些位置流动性才会变</text>
<path d="M580 122 V340" stroke="#ffffff" stroke-opacity=".85" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
<text class="hl" x="580" y="114" text-anchor="middle" >当前价格 · 活跃流动性 L = 宽区间 + 窄区间</text>
<path class="tx" d="M586 186 H900" marker-end="url(#a-tx)"/>
<text class="p" x="742" y="164" text-anchor="middle" >swap 把价格往右推</text>
<circle cx="700" cy="186" r="10" fill="#f472b6" stroke="#0d1117" stroke-width="2"/><text x="700" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1117">1</text>
<path d="M700 198 V336" stroke="#f472b6" stroke-opacity=".5" stroke-width="1" stroke-dasharray="2 4" fill="none"/>
<circle cx="800" cy="186" r="10" fill="#f472b6" stroke="#0d1117" stroke-width="2"/><text x="800" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1117">2</text>
<path d="M800 198 V336" stroke="#f472b6" stroke-opacity=".5" stroke-width="1" stroke-dasharray="2 4" fill="none"/>
<text class="p" x="64" y="390" text-anchor="start" >① 走出窄区间：L 减去它的流动性</text>
<text class="p" x="300" y="390" text-anchor="start" >② 走进上方的单边区间：L 加上它的流动性</text>
<text class="p" x="590" y="390" text-anchor="start" >每跨一个已初始化的 tick，链上实测多花约 3.9 万 gas</text>
<!-- Panel B: Tick 位图 -->
<rect class="layer" x="40" y="424" width="640" height="336" rx="12"/>
<text class="lt" x="64" y="441" text-anchor="start">BITMAP Tick 位图：找下一个已初始化的 tick</text>
<text class="p" x="64" y="464" text-anchor="start" >压缩后的 tick 高位选 word，低 8 位选 bit。一个 word 是一个 uint256（图里只画 32 位）。</text>
<rect x="64" y="522" width="16" height="26" rx="3" fill="#ffffff" fill-opacity=".05" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="82" y="522" width="16" height="26" rx="3" fill="#ffffff" fill-opacity=".05" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="100" y="522" width="16" height="26" rx="3" fill="#ffffff" fill-opacity=".05" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="118" y="522" width="16" height="26" rx="3" fill="#ffffff" fill-opacity=".05" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="136" y="522" width="16" height="26" rx="3" fill="#ffffff" fill-opacity=".05" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="154" y="522" width="16" height="26" rx="3" fill="url(#g-chain)" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="172" y="522" width="16" height="26" rx="3" fill="#ffffff" fill-opacity=".05" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="190" y="522" width="16" height="26" rx="3" fill="#ffffff" fill-opacity=".05" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="208" y="522" width="16" height="26" rx="3" fill="#ffffff" fill-opacity=".05" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="226" y="522" width="16" height="26" rx="3" fill="#ffffff" fill-opacity=".9" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="244" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="262" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="280" y="522" width="16" height="26" rx="3" fill="url(#g-chain)" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="298" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="316" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="334" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="352" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="370" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="388" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="406" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="424" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="442" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="460" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="478" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="496" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="514" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="532" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="550" y="522" width="16" height="26" rx="3" fill="url(#g-chain)" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="568" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="586" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="604" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<rect x="622" y="522" width="16" height="26" rx="3" fill="#38bdf8" fill-opacity=".16" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
<path class="sync" d="M235 516 Q262 486 287 514" marker-end="url(#a-sync)"/>
<text class="hl" x="262" y="492" text-anchor="middle" >下一个已初始化的 tick</text>
<path d="M234 554 L240 564 L228 564 Z" fill="#ffffff" fill-opacity=".9"/>
<text class="note" x="234" y="580" text-anchor="middle" >当前位置</text>
<path d="M246 558 H638" stroke="#38bdf8" stroke-opacity=".7" stroke-width="2" fill="none"/>
<text class="note" x="442" y="580" text-anchor="middle" >掩码只留更高的位，取其中最低的一位（LSB）</text>
<text class="p" x="64" y="618" text-anchor="start" >· 往右找用 LSB，往左找用 MSB，都在 BitMath 里用二分位运算实现</text>
<text class="p" x="64" y="640" text-anchor="start" >· 这个 word 里没有，就停在 word 边界，下一步再读下一个 word</text>
<text class="p" x="64" y="662" text-anchor="start" >· 链下用排序数组加二分，但在同样的边界停步。切步位置不同，</text>
<text class="p" x="76" y="684" text-anchor="start" >每步的取整就不同，最后会差 1 wei</text>
<text class="note" x="64" y="738" text-anchor="start" >contracts/lib/TickBitmap.sol · backend/router/quote.go</text>
<!-- Panel C: swap 主循环 -->
<rect class="layer" x="700" y="424" width="460" height="336" rx="12"/>
<text class="lt" x="740" y="441" text-anchor="start">LOOP swap 主循环（链上链下同一套）</text>
<rect class="box" x="740" y="452" width="396" height="48" rx="8" ry="8" fill="url(#g-core)" filter="url(#shadow)"/>
<g text-anchor="middle"><text class="t" style="font-size:14px" x="938.0" y="475.5">找下一个已初始化的 tick</text><text class="s" x="938.0" y="490.5">位图里查，最多看一个 word</text></g>
<path class="sync" d="M938 500 V516" marker-end="url(#a-sync)"/>
<rect class="box" x="740" y="518" width="396" height="48" rx="8" ry="8" fill="url(#g-core)" filter="url(#shadow)"/>
<g text-anchor="middle"><text class="t" style="font-size:14px" x="938.0" y="541.5">ComputeSwapStep</text><text class="s" x="938.0" y="556.5">这一步吃掉多少输入、给出多少输出</text></g>
<path class="sync" d="M938 566 V582" marker-end="url(#a-sync)"/>
<rect class="box" x="740" y="584" width="396" height="48" rx="8" ry="8" fill="url(#g-chain)" filter="url(#shadow)"/>
<g text-anchor="middle"><text class="t" style="font-size:14px" x="938.0" y="607.5">走到 tick 边界了？</text><text class="s" x="938.0" y="622.5">是：Tick.cross，L ± liquidityNet，回到第一步</text></g>
<path class="sync" d="M938 632 V648" marker-end="url(#a-sync)"/>
<rect class="box" x="740" y="650" width="396" height="48" rx="8" ry="8" fill="url(#g-state)" filter="url(#shadow)"/>
<g text-anchor="middle"><text class="t" style="font-size:14px" x="938.0" y="673.5">结束</text><text class="s" x="938.0" y="688.5">输入用完，或到了价格限制</text></g>
<path class="async" d="M740 608 H722 V476 H738" marker-end="url(#a-async)"/>
<text class="p" x="740" y="724" text-anchor="start" >输入向上取整、输出向下取整，舍入的零头留在池子里</text>
<text class="note" x="740" y="744" text-anchor="start" >UniGoPool.swap  ⇄  router.SimulateSwap</text>
</svg>
