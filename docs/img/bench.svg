<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Inter','SF Pro Display','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Segoe UI',system-ui,sans-serif">
<!-- 压测结果 -->
<defs>
<linearGradient id="g-client" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="g-gate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
<linearGradient id="g-core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
<linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
<linearGradient id="g-state" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#047857"/></linearGradient>
<linearGradient id="g-chain" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#c2410c"/></linearGradient>
<linearGradient id="g-risk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f43f5e"/><stop offset="1" stop-color="#9d174d"/></linearGradient>
<linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
<linearGradient id="g-grey" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#334155"/></linearGradient>
<linearGradient id="g-chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#172554"/></linearGradient>
<linearGradient id="g-title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".04"/></pattern>
<filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity=".3"/></filter>
<filter id="glow" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feFlood flood-color="#38bdf8" flood-opacity=".55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#38bdf8"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#fbbf24"/></marker>
<marker id="a-tx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f472b6"/></marker>
<style>
.layer{fill:#ffffff;fill-opacity:.03;stroke:#ffffff;stroke-opacity:.1;stroke-width:1}
.lt{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#8b949e}
.box{stroke:rgba(255,255,255,.15);stroke-width:1.2}
.tag{font:500 10px 'JetBrains Mono','SF Mono',Menlo,Consolas,'PingFang SC','Microsoft YaHei',monospace;fill:#fff;fill-opacity:.72}
.t{font-size:15px;font-weight:700;fill:#fff}
.s{font-size:11px;fill:#fff;fill-opacity:.82}
.c1{font-size:13px;font-weight:700;fill:#fff}
.c2{font-size:10px;fill:#fff;fill-opacity:.8}
.note{font-size:11px;fill:#8b949e}
.p{font-size:12px;fill:#c9d1d9}
.hl{font-size:12px;font-weight:700;fill:#7dd3fc}
.sync{fill:none;stroke:#38bdf8;stroke-width:1.8}
.async{fill:none;stroke:#fbbf24;stroke-width:1.8;stroke-dasharray:5 5;animation:flow 1.2s linear infinite}
.tx{fill:none;stroke:#f472b6;stroke-width:1.8}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.async{animation:none}}
</style>
</defs>

<rect width="1200" height="800" fill="#0d1117"/><rect width="1200" height="800" fill="url(#dots)"/>
<text x="40" y="40" font-size="24" font-weight="800" fill="url(#g-title)">压测结果</text>
<text x="40" y="62" font-size="12.5" fill="#8b949e">Apple M2 8 核 / 8 GB，k6、后端、Hardhat 节点跑在同一台机器上。数字全部来自 bench/REPORT.md。</text>
<!-- Panel 1: HTTP RPS -->
<rect class="layer" x="40" y="76" width="1120" height="384" rx="12"/>
<text class="lt" x="64" y="93" text-anchor="start">HTTP 吞吐（RPS，中位轮）· 100 并发 × 20 秒 × 3 轮，限流和并发上限关闭</text>
<path d="M320.0 112 V448" stroke="#ffffff" stroke-opacity=".08" stroke-width="1" fill="none"/>
<text class="note" x="320.0" y="108" text-anchor="middle" style="font-size:10px">0</text>
<path d="M471.2 112 V448" stroke="#ffffff" stroke-opacity=".08" stroke-width="1" fill="none"/>
<text class="note" x="471.2" y="108" text-anchor="middle" style="font-size:10px">10k</text>
<path d="M622.4 112 V448" stroke="#ffffff" stroke-opacity=".08" stroke-width="1" fill="none"/>
<text class="note" x="622.4" y="108" text-anchor="middle" style="font-size:10px">20k</text>
<path d="M773.7 112 V448" stroke="#ffffff" stroke-opacity=".08" stroke-width="1" fill="none"/>
<text class="note" x="773.7" y="108" text-anchor="middle" style="font-size:10px">30k</text>
<path d="M924.9 112 V448" stroke="#ffffff" stroke-opacity=".08" stroke-width="1" fill="none"/>
<text class="note" x="924.9" y="108" text-anchor="middle" style="font-size:10px">40k</text>
<text class="tag" x="64" y="129" text-anchor="start" style="font-size:12px;fill-opacity:.95">quote_cached</text>
<text class="note" x="64" y="143" text-anchor="start" style="font-size:10.5px">报价 · 缓存命中 · 单跳</text>
<rect x="320" y="120" width="619.5" height="22" rx="4" fill="url(#g-teal)" stroke="rgba(255,255,255,.15)"/>
<text class="p" x="949.5" y="135.5" text-anchor="start" >40,965 RPS · p99 13.40 ms</text>
<text class="tag" x="64" y="170" text-anchor="start" style="font-size:12px;fill-opacity:.95">quote_miss_1hop</text>
<text class="note" x="64" y="184" text-anchor="start" style="font-size:10.5px">报价 · 未命中 · 单跳（2 条候选）</text>
<rect x="320" y="161" width="473.8" height="22" rx="4" fill="url(#g-core)" stroke="rgba(255,255,255,.15)"/>
<text class="p" x="803.8" y="176.5" text-anchor="start" >31,329 RPS · p99 10.96 ms</text>
<text class="tag" x="64" y="211" text-anchor="start" style="font-size:12px;fill-opacity:.95">quote_cached_3hop</text>
<text class="note" x="64" y="225" text-anchor="start" style="font-size:10.5px">报价 · 缓存命中 · 三跳</text>
<rect x="320" y="202" width="569.0" height="22" rx="4" fill="url(#g-teal)" stroke="rgba(255,255,255,.15)"/>
<text class="p" x="899.0" y="217.5" text-anchor="start" >37,625 RPS · p99 12.94 ms</text>
<text class="tag" x="64" y="252" text-anchor="start" style="font-size:12px;fill-opacity:.95">quote_miss_3hop</text>
<text class="note" x="64" y="266" text-anchor="start" style="font-size:10.5px">报价 · 未命中 · 三跳（8 条候选）</text>
<rect x="320" y="243" width="167.8" height="22" rx="4" fill="url(#g-core)" stroke="rgba(255,255,255,.15)"/>
<text class="p" x="497.8" y="258.5" text-anchor="start" >11,098 RPS · p99 25.34 ms</text>
<text class="tag" x="64" y="293" text-anchor="start" style="font-size:12px;fill-opacity:.95">klines</text>
<text class="note" x="64" y="307" text-anchor="start" style="font-size:10.5px">K 线（最近 100 根 1m）</text>
<rect x="320" y="284" width="281.3" height="22" rx="4" fill="url(#g-core)" stroke="rgba(255,255,255,.15)"/>
<text class="p" x="611.3" y="299.5" text-anchor="start" >18,602 RPS · p99 35.21 ms</text>
<text class="tag" x="64" y="334" text-anchor="start" style="font-size:12px;fill-opacity:.95">trades</text>
<text class="note" x="64" y="348" text-anchor="start" style="font-size:10.5px">成交（最近 50 笔）</text>
<rect x="320" y="325" width="426.3" height="22" rx="4" fill="url(#g-core)" stroke="rgba(255,255,255,.15)"/>
<text class="p" x="756.3" y="340.5" text-anchor="start" >28,194 RPS · p99 22.45 ms</text>
<text class="tag" x="64" y="375" text-anchor="start" style="font-size:12px;fill-opacity:.95">build</text>
<text class="note" x="64" y="389" text-anchor="start" style="font-size:10.5px">构造交易（含链上 Quoter eth_call）</text>
<rect x="320" y="366" width="27.7" height="22" rx="4" fill="url(#g-chain)" stroke="rgba(255,255,255,.15)"/>
<text class="p" x="357.7" y="381.5" text-anchor="start" >1,835 RPS · p99 113.32 ms</text>
<text class="tag" x="64" y="416" text-anchor="start" style="font-size:12px;fill-opacity:.95">mixed</text>
<text class="note" x="64" y="430" text-anchor="start" style="font-size:10.5px">混合读</text>
<rect x="320" y="407" width="388.3" height="22" rx="4" fill="url(#g-core)" stroke="rgba(255,255,255,.15)"/>
<text class="p" x="718.3" y="422.5" text-anchor="start" >25,679 RPS · p99 21.65 ms</text>
<!-- Panel 2: 路由 serial vs pool -->
<rect class="layer" x="40" y="476" width="550" height="264" rx="12"/>
<text class="lt" x="64" y="493" text-anchor="start">路由搜索：串行 vs Worker Pool（µs/次）</text>
<rect x="64" y="508" width="11" height="11" rx="2" fill="url(#g-grey)" stroke="rgba(255,255,255,.3)"/>
<text class="note" x="81" y="518" text-anchor="start" >串行评估</text>
<rect x="150" y="508" width="11" height="11" rx="2" fill="url(#g-gate)"/>
<text class="note" x="167" y="518" text-anchor="start" >Worker Pool 并发评估</text>
<path d="M80 690 H550" stroke="#ffffff" stroke-opacity=".25" stroke-width="1" fill="none"/>
<rect x="122" y="672.8" width="44" height="17.2" rx="3" fill="url(#g-grey)" stroke="rgba(255,255,255,.2)"/>
<text class="p" x="144" y="667.8" text-anchor="middle" style="font-size:10.5px">187.4</text>
<rect x="174" y="680.0" width="44" height="10.0" rx="3" fill="url(#g-gate)" stroke="rgba(255,255,255,.2)"/>
<text class="p" x="196" y="675.0" text-anchor="middle" style="font-size:10.5px">109.0</text>
<text class="note" x="170" y="708" text-anchor="middle" >8 条三跳候选</text>
<text class="hl" x="170" y="726" text-anchor="middle" >快 1.72×</text>
<rect x="277" y="620.6" width="44" height="69.4" rx="3" fill="url(#g-grey)" stroke="rgba(255,255,255,.2)"/>
<text class="p" x="299" y="615.6" text-anchor="middle" style="font-size:10.5px">755.2</text>
<rect x="329" y="654.6" width="44" height="35.4" rx="3" fill="url(#g-gate)" stroke="rgba(255,255,255,.2)"/>
<text class="p" x="351" y="649.6" text-anchor="middle" style="font-size:10.5px">385.0</text>
<text class="note" x="325" y="708" text-anchor="middle" >32 条三跳候选</text>
<text class="hl" x="325" y="726" text-anchor="middle" >快 1.96×</text>
<rect x="432" y="550.0" width="44" height="140.0" rx="3" fill="url(#g-grey)" stroke="rgba(255,255,255,.2)"/>
<text class="p" x="454" y="545.0" text-anchor="middle" style="font-size:10.5px">1,523.6</text>
<rect x="484" y="619.4" width="44" height="70.6" rx="3" fill="url(#g-gate)" stroke="rgba(255,255,255,.2)"/>
<text class="p" x="506" y="614.4" text-anchor="middle" style="font-size:10.5px">767.9</text>
<text class="note" x="480" y="708" text-anchor="middle" >64 条三跳候选</text>
<text class="hl" x="480" y="726" text-anchor="middle" >快 1.98×</text>
<!-- Panel 3: 保护生效 -->
<rect class="layer" x="610" y="476" width="550" height="264" rx="12"/>
<text class="lt" x="634" y="493" text-anchor="start">限流与背压：超限的请求确实被挡住</text>
<text class="p" x="634" y="520" text-anchor="start" >令牌桶：每 IP 100 请求/秒、突发 200（mixed 场景）</text>
<rect x="634" y="530" width="500" height="22" rx="4" fill="url(#g-risk)"/><rect x="634" y="530" width="3.0" height="22" rx="4" fill="#22c55e"/>
<text class="note" x="634" y="570" text-anchor="start" style="fill:#4ade80">放行 2,200（0.27%）</text>
<text class="note" x="1134" y="570" text-anchor="end" style="fill:#fb7185">429 拒绝 822,861（99.73%）</text>
<text class="p" x="634" y="608" text-anchor="start" >并发信号量：全局上限 20（quote_miss_3hop 场景）</text>
<rect x="634" y="618" width="500" height="22" rx="4" fill="url(#g-risk)"/><rect x="634" y="618" width="75.4" height="22" rx="4" fill="#22c55e"/>
<text class="note" x="634" y="658" text-anchor="start" style="fill:#4ade80">放行 105,301（15.08%）</text>
<text class="note" x="1134" y="658" text-anchor="end" style="fill:#fb7185">503 拒绝 592,976（84.92%）</text>
<text class="note" x="634" y="700" text-anchor="start" >令牌桶 20 秒内理论上最多放行 200 + 100 × 20 = 2,200 个，实测正好 2,200。</text>
<text class="note" x="634" y="720" text-anchor="start" >429 / 503 的数量和后端指标的增量逐个对上。</text>
<text class="note" x="40" y="772" text-anchor="start" >k6 和后端抢同一批 CPU，绝对值只代表这台机器；缓存命中与未命中、串行与并发这类相对关系受负载影响小得多。</text>
</svg>
