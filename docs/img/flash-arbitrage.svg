<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Inter','SF Pro Display','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Segoe UI',system-ui,sans-serif">
<!-- 闪电贷三池套利 -->
<defs>
<linearGradient id="g-client" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="g-gate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
<linearGradient id="g-core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
<linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
<linearGradient id="g-state" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#047857"/></linearGradient>
<linearGradient id="g-chain" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#c2410c"/></linearGradient>
<linearGradient id="g-risk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f43f5e"/><stop offset="1" stop-color="#9d174d"/></linearGradient>
<linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
<linearGradient id="g-grey" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#334155"/></linearGradient>
<linearGradient id="g-chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#172554"/></linearGradient>
<linearGradient id="g-title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".04"/></pattern>
<filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity=".3"/></filter>
<filter id="glow" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feFlood flood-color="#38bdf8" flood-opacity=".55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#38bdf8"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#fbbf24"/></marker>
<marker id="a-tx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f472b6"/></marker>
<style>
.layer{fill:#ffffff;fill-opacity:.03;stroke:#ffffff;stroke-opacity:.1;stroke-width:1}
.lt{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#8b949e}
.box{stroke:rgba(255,255,255,.15);stroke-width:1.2}
.tag{font:500 10px 'JetBrains Mono','SF Mono',Menlo,Consolas,'PingFang SC','Microsoft YaHei',monospace;fill:#fff;fill-opacity:.72}
.t{font-size:15px;font-weight:700;fill:#fff}
.s{font-size:11px;fill:#fff;fill-opacity:.82}
.c1{font-size:13px;font-weight:700;fill:#fff}
.c2{font-size:10px;fill:#fff;fill-opacity:.8}
.note{font-size:11px;fill:#8b949e}
.p{font-size:12px;fill:#c9d1d9}
.hl{font-size:12px;font-weight:700;fill:#7dd3fc}
.sync{fill:none;stroke:#38bdf8;stroke-width:1.8}
.async{fill:none;stroke:#fbbf24;stroke-width:1.8;stroke-dasharray:5 5;animation:flow 1.2s linear infinite}
.tx{fill:none;stroke:#f472b6;stroke-width:1.8}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.async{animation:none}}
</style>
</defs>

<rect width="1200" height="800" fill="#0d1117"/><rect width="1200" height="800" fill="url(#dots)"/>
<text x="40" y="40" font-size="24" font-weight="800" fill="url(#g-title)">闪电贷三池套利</text>
<text x="40" y="62" font-size="12.5" fill="#8b949e">同一个币对的不同费率池各自定价，出现价差时借第三个池子的钱，一笔交易里搬平。</text>
<!-- Top: 链下扫描 -->
<rect class="layer" x="40" y="76" width="1120" height="150" rx="12"/>
<text class="lt" x="64" y="93" text-anchor="start">OFF-CHAIN 扫描器先算好借多少 · backend/arb</text>
<rect class="box" x="64" y="108" width="250" height="100" rx="8" ry="8" fill="url(#g-state)" filter="url(#shadow)"/>
<g text-anchor="middle"><text class="tag" x="189.0" y="145.0">[Trigger] OnSwap</text><text class="t" style="font-size:15px" x="189.0" y="164.0">每笔 Swap 触发一次</text><text class="s" x="189.0" y="179.0">只比成交的池子和同币对的其它池子</text></g>
<rect class="box" x="338" y="108" width="250" height="100" rx="8" ry="8" fill="url(#g-core)" filter="url(#shadow)"/>
<g text-anchor="middle"><text class="tag" x="463.0" y="145.0">[Search] 三分搜索</text><text class="t" style="font-size:15px" x="463.0" y="164.0">找最优借入量</text><text class="s" x="463.0" y="179.0">利润函数直接用逐 tick 模拟</text></g>
<rect class="box" x="612" y="108" width="250" height="100" rx="8" ry="8" fill="url(#g-violet)" filter="url(#shadow)"/>
<g text-anchor="middle"><text class="tag" x="737.0" y="145.0">[Check] balanceOf</text><text class="t" style="font-size:15px" x="737.0" y="164.0">查放贷池余额、扣 gas</text><text class="s" x="737.0" y="179.0">gas 按 WETH 池现价折成借入 token</text></g>
<rect class="box" x="886" y="108" width="250" height="100" rx="8" ry="8" fill="url(#g-gate)" filter="url(#shadow)"/>
<g text-anchor="middle"><text class="tag" x="1011.0" y="145.0">[Calldata]</text><text class="t" style="font-size:15px" x="1011.0" y="164.0">生成调用数据</text><text class="s" x="1011.0" y="179.0">minProfit = gas 成本 · 不代签不代发</text></g>
<path class="sync" d="M314 158 H336" marker-end="url(#a-sync)"/>
<path class="sync" d="M588 158 H610" marker-end="url(#a-sync)"/>
<path class="sync" d="M862 158 H884" marker-end="url(#a-sync)"/>
<path class="async" d="M600 226 V262" marker-end="url(#a-async)"/>
<text class="note" x="612" y="249" text-anchor="start" >调用数据交给发起人，自己签名发送</text>
<!-- Bottom: 链上执行 -->
<rect class="layer" x="40" y="264" width="1120" height="476" rx="12"/>
<text class="lt" x="64" y="281" text-anchor="start">ON-CHAIN 一笔交易里做完 · FlashArbitrage.sol</text>
<rect class="box" x="64" y="330" width="260" height="110" rx="8" ry="8" fill="url(#g-chain)" filter="url(#shadow)"/>
<g text-anchor="middle"><text class="tag" x="194.0" y="364.5">[Lender] 必须是第三个池子</text><text class="t" style="font-size:15px" x="194.0" y="383.5">放贷池（X / Z）</text><text class="s" x="194.0" y="398.5">flash 期间上着重入锁</text><text class="s" x="194.0" y="413.5">还款不够就整笔 revert</text></g>
<rect class="box" x="440" y="330" width="320" height="110" rx="8" ry="8" fill="url(#g-gate)" filter="url(#glow)"/>
<g text-anchor="middle"><text class="tag" x="600.0" y="370.5">[Contract] uniGoFlashCallback</text><text class="t" style="font-size:18px" x="600.0" y="392.5">FlashArbitrage</text><text class="s" x="600.0" y="407.5">回调里连做两次 swap</text></g>
<rect class="box" x="876" y="300" width="260" height="76" rx="8" ry="8" fill="url(#g-chain)" filter="url(#shadow)"/>
<g text-anchor="middle"><text class="tag" x="1006.0" y="325.0">[sellPool] X 较贵</text><text class="t" style="font-size:15px" x="1006.0" y="344.0">卖出池</text><text class="s" x="1006.0" y="359.0">卖掉全部 X，换回 Y</text></g>
<rect class="box" x="876" y="394" width="260" height="76" rx="8" ry="8" fill="url(#g-chain)" filter="url(#shadow)"/>
<g text-anchor="middle"><text class="tag" x="1006.0" y="419.0">[buyPool] X 较便宜</text><text class="t" style="font-size:15px" x="1006.0" y="438.0">买入池</text><text class="s" x="1006.0" y="453.0">用全部 Y 买回 X</text></g>
<path class="tx" d="M324 360 H438" marker-end="url(#a-tx)"/>
<text class="hl" x="382" y="352" text-anchor="middle" >① flash 借出 X</text>
<path class="tx" d="M440 410 H326" marker-end="url(#a-tx)"/>
<text class="hl" x="382" y="428" text-anchor="middle" >④ 还款 + 手续费</text>
<path class="tx" d="M760 352 H874" marker-end="url(#a-tx)"/>
<text class="hl" x="818" y="344" text-anchor="middle" >② 卖出全部 X</text>
<path class="tx" d="M760 420 H874" marker-end="url(#a-tx)"/>
<text class="hl" x="818" y="438" text-anchor="middle" >③ 用 Y 买回 X</text>
<rect class="box" x="440" y="560" width="320" height="76" rx="8" ry="8" fill="url(#g-client)" filter="url(#shadow)"/>
<g text-anchor="middle"><text class="tag" x="600.0" y="585.0">[EOA] 零本金，只付 gas</text><text class="t" style="font-size:15px" x="600.0" y="604.0">发起人</text><text class="s" x="600.0" y="619.0">调用 arbitrage(params)</text></g>
<path class="tx" d="M540 558 V442" marker-end="url(#a-tx)"/>
<text class="p" x="530" y="504" text-anchor="end" >发起交易</text>
<path class="tx" d="M660 440 V558" marker-end="url(#a-tx)"/>
<text class="hl" x="670" y="496" text-anchor="start" >⑤ 剩下的 X 就是利润</text>
<text class="p" x="670" y="514" text-anchor="start" >不够 minProfit 整笔回滚，只亏 gas</text>
<text class="lt" x="64" y="496" text-anchor="start" >为什么不能向买卖两池借</text>
<text class="p" x="64" y="520" text-anchor="start" >flash 从转出到验完还款之间，这个池子的 swap</text>
<text class="p" x="64" y="540" text-anchor="start" >一律以 LOK revert。套利的两次 swap 正好发生在</text>
<text class="p" x="64" y="560" text-anchor="start" >回调里，所以放贷池只能是另一个持有 X 的池子。</text>
<text class="lt" x="860" y="548" text-anchor="start" >合约里的四道检查</text>
<text class="p" x="860" y="570" text-anchor="start" >· minProfit：不赚就整笔回滚</text>
<text class="p" x="860" y="590" text-anchor="start" >· _expectedCaller：只认当前该回调的池子</text>
<text class="p" x="860" y="610" text-anchor="start" >· 三个池子都必须是 Factory 创建的</text>
<text class="p" x="860" y="630" text-anchor="start" >· 部分成交就回滚，合约里不留余额</text>
<text class="p" x="64" y="672" text-anchor="start" >集成测试在真实节点上原样执行扫描器给的调用数据：</text>
<text class="p" x="64" y="694" text-anchor="start" >借入约 34,868 个 token，发起人到手约 1,060 个，和链下预测逐位相等；gas 367,570；两池价差从 5.910% 收到 0.648%。</text>
<text class="note" x="64" y="722" text-anchor="start" >合约 gas 报告里 FlashArbitrage.arbitrage 平均 304,040 gas。</text>
</svg>
